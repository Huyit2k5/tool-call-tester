[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "toolcheck"
version = "0.4.0"
description = "pytest cho tool-call của agent: offline, bắt lỗi chọn tool, sai tham số, vòng lặp vô hạn."
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
dependencies = []

[project.optional-dependencies]
yaml = ["pyyaml>=6"]
openai = ["openai>=1"]
anthropic = ["anthropic>=0.40"]
mcp = ["mcp>=1"]

[project.scripts]
toolcheck = "toolcheck.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
